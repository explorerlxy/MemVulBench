   <g id="text_1">
    <text style="font: 700 13px 'DejaVu Sans'; text-anchor: middle" x="328.05" y="20.20068" transform="rotate(-0 328.05 20.20068)">Design goal: 20 real projects, one exposed harness per project</text>
   </g>
   <g id="text_2">
    <!-- Test unit: $U=(P,V,H)$     Campaign: $C=(F,S,U,T)$ -->
    <g style="fill: #0072b2" transform="translate(140.7 57.34548)">
     <text>
      <tspan style="font: 15px 'DejaVu Sans'" x="0 9.162598 18.391113 26.206055 32.087402 36.855469 46.362305 55.869141 60.036621 65.917969 70.97168 89.641113 105.131836 120.029297 137.980957 156.950684 162.802734 167.570801 172.338867 177.106934 181.875 186.643066 197.116699 206.308594 220.92041 230.441895 239.633789 243.80127 253.322754 262.82959 267.883301 286.047363 301.538086 316.018066 333.22998 351.899414 368.752441" y="-0.609375">Test unit: =(,,)     Campaign: =(,,,)</tspan>
      <tspan style="font: oblique 15px 'DejaVu Sans'" x="75.739746 110.983887 127.719727 145.671387 272.651367 307.390137 323.708496 340.92041 359.589844" y="-0.609375">UPVHCFSUT</tspan>
     </text>
    </g>
   </g>
   <g id="text_3">
    <text style="fill: #52616b; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="328.05" y="77.77512" transform="rotate(-0 328.05 77.77512)">Program / revision / harness   |   Fuzzer / sanitizer / unit / time budget</text>
   </g>
   <g id="text_4">
    <text style="fill: #0072b2; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="164.4165" y="136.274359" transform="rotate(-0 164.4165 136.274359)">C1  Native programs and historical faults</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(83.864391 169.061572)">Preserve historical program context</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(89.148375 181.191181)">Trace candidate fault provenance</text>
   </g>
   <g id="text_6">
    <text style="fill: #0072b2; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="491.6835" y="136.274359" transform="rotate(-0 491.6835 136.274359)">C2  Scoring entries per test unit</text>
   </g>
   <g id="text_7">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(404.697094 169.061572)">Count witnessed first-fault fingerprints</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(409.023422 181.191181)">Interpret within a fixed configuration</text>
   </g>
   <g id="text_8">
    <text style="fill: #009e73; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="164.4165" y="247.749774" transform="rotate(-0 164.4165 247.749774)">C3  Input-level verification materials</text>
   </g>
   <g id="text_9">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(78.065719 280.495972)">Inputs and reports: physical witnesses</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(68.989078 292.625581)">Fingerprints: operational scoring identities</text>
   </g>
   <g id="text_10">
    <text style="fill: #009e73; font: 700 10.5px 'DejaVu Sans'; text-anchor: middle" x="491.6835" y="247.749774" transform="rotate(-0 491.6835 247.749774)">C4  Fixed build and runtime environments</text>
   </g>
   <g id="text_11">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(393.883734 280.495972)">Record sources, binaries and dependencies</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(417.229594 292.625581)">Audit image and replay evidence</text>
   </g>
   <g id="text_12">
    <text style="fill: #52616b; font: 9.5px 'DejaVu Sans'; text-anchor: middle" x="328.05" y="339.64596" transform="rotate(-0 328.05 339.64596)">Environment E is linked separately; repetitions R belong to the experiment design.</text>
   </g>
   <g id="text_13">
    <text style="fill: #52616b; font: 9px 'DejaVu Sans'; text-anchor: middle" x="328.05" y="361.93284" transform="rotate(-0 328.05 361.93284)">All four criteria require evidence; quantity alone does not establish evaluation efficiency.</text>
   </g>
  </g>
 </g>
